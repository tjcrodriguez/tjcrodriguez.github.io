<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Converter | Mini Portfolio</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-title="Converter">
  <main class="page">
    <div class="split">
      <form id="form" class="card" novalidate>
        <h2 class="t">Conversion</h2>
        <div class="seg" role="group" aria-label="Conversion type">
          <button type="button" class="on" data-mode="c2f" aria-pressed="true">°C → °F</button>
          <button type="button" data-mode="f2c" aria-pressed="false">°F → °C</button>
          <button type="button" data-mode="m2ft" aria-pressed="false">m → ft</button>
          <button type="button" data-mode="ft2m" aria-pressed="false">ft → m</button>
        </div>
        <div>
          <label id="label" for="value">Value in °C</label>
          <input id="value" type="number" inputmode="decimal" step="any">
        </div>
        <p id="error" class="error" role="alert"></p>
        <button class="btn" type="submit">Convert</button>
      </form>
      <section class="card" aria-live="polite">
        <p class="d">Result</p>
        <output id="result" class="big">-</output>
        <p id="formula" class="d"></p>
      </section>
    </div>
  </main>
  <script src="js/nav.js"></script>
  <script src="js/converter.js"></script>
</body>
</html>
